<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Horsey Command Desk — Secure Access</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Private AES-256 vault login for the Horsey command desk.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#070a10;--card:#0f1520;--line:#243049;--txt:#e8edf7;--mut:#8b97b0;--acc:#38bdf8;--neg:#f43f5e;--pos:#22c55e;--warn:#f59e0b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.card{width:min(100%,420px);background:linear-gradient(180deg,#121a28,#0f1520);border:1px solid var(--line);border-radius:16px;padding:22px 20px 18px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.brand{font-weight:800;font-size:18px;letter-spacing:-.02em}.brand small{display:block;font-weight:500;color:var(--mut);font-size:12.5px;margin-top:4px}
.lockico{font-size:28px;margin-bottom:8px}
label{display:block;margin:14px 0 6px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.row{display:flex;gap:8px;align-items:center}
input[type=password],input[type=text]{width:100%;font:inherit;color:var(--txt);background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:12px 12px;min-height:44px}
input:focus{outline:2px solid rgba(56,189,248,.35);border-color:var(--acc)}
button{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--line);background:#172033;color:var(--txt);padding:11px 14px;cursor:pointer;min-height:44px}
button.primary{flex:1;background:#0c4a6e;border-color:var(--acc);color:#e0f2fe}
button.ghost{background:transparent}
.err{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;background:#3b0d16;border:1px solid #7f1d1d;color:#fecdd3;font-size:13.5px}
.err.show{display:block}
.hint{color:var(--mut);font-size:12.5px;margin-top:12px;line-height:1.4}
.check{display:flex;gap:8px;align-items:center;margin:12px 0 4px;color:var(--mut);font-size:13.5px}
.check input{width:18px;height:18px}
.visually-hidden{position:absolute!important;height:1px;width:1px;overflow:hidden;clip:rect(1px,1px,1px,1px);white-space:nowrap}
.busy button.primary{opacity:.7;pointer-events:none}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;margin-right:8px;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head><body>
<div class="wrap" id="gateWrap">
 <form class="card" id="vaultForm" method="post" action="#" autocomplete="on">
  <div class="lockico" aria-hidden="true">🔒</div>
  <div class="brand">Horsey Command Desk<small>Private Executive Access</small></div>
  <label class="visually-hidden" for="vaultUser">Username</label>
  <input class="visually-hidden" type="text" id="vaultUser" name="username" value="horsey-ceo" autocomplete="username" tabindex="-1" aria-hidden="true">
  <label for="vaultPass">CEO password</label>
  <div class="row">
   <input type="password" id="vaultPass" name="password" autocomplete="current-password" placeholder="Enter CEO password" required minlength="1">
   <button type="button" class="ghost" id="togglePass" aria-label="Show password">Show</button>
  </div>
  <label class="check"><input type="checkbox" id="rememberDevice" checked> Remember on this device</label>
  <div class="row" style="margin-top:14px">
   <button type="submit" class="primary" id="unlockBtn">Unlock Command Desk</button>
  </div>
  <div class="err" id="vaultErr" role="alert"></div>
  <p class="hint">Enter your password to unlock the command desk. Wrong passwords never leave this device.</p>
 </form>
</div>
<script>
(function(){
"use strict";
const APP_URL = "./vault/app.enc.json";
const STATE_URL = "./vault/state.enc.json";
const MANIFEST_URL = "./vault/manifest.json";
const DK_LS = "horsey_vault_dk";
const META_LS = "horsey_vault_meta";
const nativeFetch = window.fetch.bind(window);
let VAULT_FILES = Object.create(null);
let activeKey = null;
let activeSaltB64 = null;
let stateRefreshAt = 0;
let currentStateV = null;
let currentAppV = null;
const STATE_REFRESH_MS = 4000;

const $ = (id) => document.getElementById(id);
const errBox = $("vaultErr");
function showErr(msg){ errBox.textContent = msg; errBox.classList.add("show"); }
function clearErr(){ errBox.textContent = ""; errBox.classList.remove("show"); }

function b64ToBytes(b64){
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function bytesToB64(bytes){
  let s = "";
  const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  for (let i=0;i<u8.length;i++) s += String.fromCharCode(u8[i]);
  return btoa(s);
}
async function deriveKey(password, saltBytes, iter){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt: saltBytes, iterations: iter||600000, hash:"SHA-256" },
    baseKey,
    { name:"AES-GCM", length:256 },
    true,
    ["encrypt","decrypt"]
  );
}
async function importRawKey(b64){
  return crypto.subtle.importKey("raw", b64ToBytes(b64), { name:"AES-GCM" }, true, ["encrypt","decrypt"]);
}
async function exportRawKey(key){
  return bytesToB64(new Uint8Array(await crypto.subtle.exportKey("raw", key)));
}
async function gunzipToText(buf){
  if (typeof DecompressionStream === "undefined") {
    throw new Error("This browser cannot decompress the vault (needs DecompressionStream).");
  }
  const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(stream).text();
}
async function decryptEnvelope(key, env){
  const iv = b64ToBytes(env.iv);
  const ct = b64ToBytes(env.ct);
  const plainBuf = await crypto.subtle.decrypt({ name:"AES-GCM", iv }, key, ct);
  if (env.comp === "gzip") return await gunzipToText(plainBuf);
  return new TextDecoder().decode(plainBuf);
}
function expandAliases(payload){
  const files = Object.assign(Object.create(null), (payload && payload.files) || {});
  const aliases = (payload && payload.aliases) || {};
  for (const [alias, target] of Object.entries(aliases)) {
    if (Object.prototype.hasOwnProperty.call(files, target)) files[alias] = files[target];
  }
  return files;
}
function guessType(path){
  if (path.endsWith(".json") || path.endsWith(".jsonl")) return "application/json; charset=utf-8";
  if (path.endsWith(".md")) return "text/markdown; charset=utf-8";
  if (path.endsWith(".csv")) return "text/csv; charset=utf-8";
  if (path.endsWith(".js")) return "text/javascript; charset=utf-8";
  if (path.endsWith(".html")) return "text/html; charset=utf-8";
  return "text/plain; charset=utf-8";
}
function normalizePath(url){
  try {
    const u = (typeof url === "string") ? new URL(url, location.href) : new URL(url.url, location.href);
    if (u.origin !== location.origin) return null;
    let path = u.pathname.replace(/^\.\//,"");
    const base = location.pathname.replace(/\/[^/]*$/, "/");
    if (path.startsWith(base)) path = path.slice(base.length);
    path = path.replace(/^\/+/, "");
    return path;
  } catch(e){ return null; }
}
async function fetchManifest(){
  const r = await nativeFetch(MANIFEST_URL + "?_cb=" + Date.now(), { cache:"no-store" });
  if (!r.ok) return null;
  return r.json();
}
async function fetchVaultEnvelopes(){
  let man = null;
  try { man = await fetchManifest(); } catch(e){}
  const appUrl = (man && man.app_v) ? (APP_URL + "?v=" + encodeURIComponent(man.app_v)) : (APP_URL + "?_cb=" + Date.now());
  const stateUrl = (man && man.state_v) ? (STATE_URL + "?v=" + encodeURIComponent(man.state_v)) : (STATE_URL + "?_cb=" + Date.now());
  const cacheMode = (man && man.app_v && man.state_v) ? "force-cache" : "no-store";
  const [appR, stateR] = await Promise.all([
    nativeFetch(appUrl, { cache: cacheMode }),
    nativeFetch(stateUrl, { cache: cacheMode })
  ]);
  if (!appR.ok || !stateR.ok) throw new Error("Vault files unavailable (" + appR.status + "/" + stateR.status + ").");
  const [appEnv, stateEnv] = await Promise.all([appR.json(), stateR.json()]);
  return { man, appEnv, stateEnv };
}
// Kick off envelope download the instant the gate opens (parallel with password typing / auto-unlock)
let bundlePromise = fetchVaultEnvelopes().catch((e) => { bundlePromise = null; throw e; });

async function refreshStateIfNeeded(force){
  const now = Date.now();
  if (!force && now - stateRefreshAt < STATE_REFRESH_MS) return false;
  if (!activeKey) return false;
  stateRefreshAt = now;
  try {
    let man = null;
    try { man = await fetchManifest(); } catch(e){}
    if (!force && man && man.state_v && man.state_v === currentStateV) {
      return false; // 120-byte poll — nothing changed
    }
    const stateUrl = (man && man.state_v)
      ? (STATE_URL + "?v=" + encodeURIComponent(man.state_v))
      : (STATE_URL + "?_cb=" + now);
    const r = await nativeFetch(stateUrl, { cache: (man && man.state_v) ? "force-cache" : "no-store" });
    if (!r.ok) return false;
    const env = await r.json();
    const txt = await decryptEnvelope(activeKey, env);
    const payload = JSON.parse(txt);
    Object.assign(VAULT_FILES, expandAliases(payload));
    if (man && man.state_v) currentStateV = man.state_v;
    return true;
  } catch(e){ return false; }
}
function installFetchWrapper(){
  window.fetch = async function(input, init){
    try {
      const path = normalizePath(input);
      if (path == null) return nativeFetch(input, init);
      if (path.startsWith("vault/")) return nativeFetch(input, init);
      const href = (typeof input === "string") ? input : (input && input.url) || "";
      if (/[?&]_cb=/.test(href) || /[?&]t=/.test(href)) await refreshStateIfNeeded(false);
      if (Object.prototype.hasOwnProperty.call(VAULT_FILES, path)) {
        let body = VAULT_FILES[path];
        if (typeof body !== "string") body = JSON.stringify(body);
        return new Response(body, { status:200, headers:{ "Content-Type": guessType(path), "X-Horsey-Vault":"1" }});
      }
      return new Response(JSON.stringify({ error:"not_in_vault", path }), { status:404, headers:{ "Content-Type":"application/json" }});
    } catch(e) {
      return nativeFetch(input, init);
    }
  };
}
function patchHtml(html){
  if (!/id="vaultLockBtn"/.test(html)) {
    html = html.replace(
      /(<button class="bellbtn" id="bellBtn")/,
      '<button type="button" class="bellbtn" id="vaultLockBtn" title="Lock vault" aria-label="Lock">🔒</button>\n $1'
    );
  }
  const boot = `<script>(function(){function wire(){var b=document.getElementById("vaultLockBtn");if(!b)return;b.onclick=function(){try{localStorage.removeItem("${DK_LS}");sessionStorage.removeItem("${DK_LS}");localStorage.removeItem("${META_LS}");}catch(e){}location.reload();};}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",wire);else wire();})();<\/script>`;
  if (html.includes("</body>")) html = html.replace("</body>", boot + "</body>");
  else html += boot;
  return html;
}
function loadExternalScript(src, globalCheck, timeoutMs){
  if (globalCheck && window[globalCheck]) return Promise.resolve();
  return new Promise((resolve) => {
    const existing = Array.from(document.scripts).find(el => el.src === src);
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };
    const timer = setTimeout(finish, timeoutMs || 3500);
    if (existing) {
      if (globalCheck && window[globalCheck]) { clearTimeout(timer); return finish(); }
      existing.addEventListener("load", () => { clearTimeout(timer); finish(); }, { once: true });
      existing.addEventListener("error", () => { clearTimeout(timer); finish(); }, { once: true });
      return;
    }
    const sc = document.createElement("script");
    sc.src = src;
    sc.async = false;
    sc.onload = () => { clearTimeout(timer); finish(); };
    sc.onerror = () => { clearTimeout(timer); finish(); };
    document.head.appendChild(sc);
  });
}
async function mountApp(appPayload){
  const html = patchHtml(appPayload.html || "");
  if (appPayload.files) Object.assign(VAULT_FILES, appPayload.files);
  installFetchWrapper();
  const parsed = new DOMParser().parseFromString(html, "text/html");
  if (parsed.title) document.title = parsed.title;
  // Remove login-gate styles, inject unlocked dashboard styles & links
  Array.from(document.head.querySelectorAll("style")).forEach(el => el.remove());
  Array.from(parsed.head.querySelectorAll("style, link[rel=icon]")).forEach(el => {
    document.head.appendChild(document.importNode(el, true));
  });
  document.body.className = parsed.body.className || "";
  document.body.innerHTML = parsed.body.innerHTML;
  // Run scripts in exact document order without document.write()
  const allScripts = [
    ...Array.from(parsed.head.querySelectorAll("script")),
    ...Array.from(parsed.body.querySelectorAll("script"))
  ];
  // Remove inert script placeholders copied by innerHTML before executing live ones
  Array.from(document.body.querySelectorAll("script")).forEach(el => el.remove());
  for (const orig of allScripts) {
    const src = orig.getAttribute("src");
    if (src) {
      const check = /chart(\.umd)?(\.min)?\.js/i.test(src) ? "Chart"
                  : /marked(\.min)?\.js/i.test(src) ? "marked" : null;
      await loadExternalScript(src, check, 3500);
    } else if ((orig.textContent || "").trim()) {
      const sc = document.createElement("script");
      for (const attr of Array.from(orig.attributes)) sc.setAttribute(attr.name, attr.value);
      sc.textContent = orig.textContent;
      document.body.appendChild(sc);
    }
  }
}
async function unlockWithBundle(key, remember, metaSalt, metaIter){
  let bundle;
  try {
    bundle = await (bundlePromise || fetchVaultEnvelopes());
  } catch (e) {
    bundlePromise = fetchVaultEnvelopes();
    bundle = await bundlePromise;
  }
  const { man, appEnv, stateEnv } = bundle;
  if (metaSalt && appEnv.salt !== metaSalt) throw new Error("Vault key changed — please unlock with your password.");
  let appTxt, stateTxt;
  try {
    [appTxt, stateTxt] = await Promise.all([
      decryptEnvelope(key, appEnv),
      decryptEnvelope(key, stateEnv)
    ]);
  } catch (e) {
    throw new Error("Incorrect password. Please try again.");
  }
  const appPayload = JSON.parse(appTxt);
  const statePayload = JSON.parse(stateTxt);
  VAULT_FILES = expandAliases(statePayload);
  activeKey = key;
  activeSaltB64 = appEnv.salt;
  stateRefreshAt = Date.now();
  currentAppV = man && man.app_v || null;
  currentStateV = man && man.state_v || null;
  if (remember != null) {
    const raw = await exportRawKey(key);
    const store = remember ? localStorage : sessionStorage;
    const other = remember ? sessionStorage : localStorage;
    try {
      other.removeItem(DK_LS); other.removeItem(META_LS);
      store.setItem(DK_LS, raw);
      store.setItem(META_LS, JSON.stringify({ salt: appEnv.salt, iter: metaIter || appEnv.iter || 600000 }));
    } catch(e){}
  }
  await mountApp(appPayload);
}
async function unlockWithPassword(password, remember){
  // Ensure envelopes are in flight / ready while we derive the key
  if (!bundlePromise) bundlePromise = fetchVaultEnvelopes();
  const saltHintP = bundlePromise.then(b => b.appEnv).catch(()=>null);
  const appEnvHint = await saltHintP;
  const salt = b64ToBytes((appEnvHint && appEnvHint.salt) || (await (bundlePromise = fetchVaultEnvelopes()).then(b=>b.appEnv)).salt);
  const iter = (appEnvHint && appEnvHint.iter) || 600000;
  const key = await deriveKey(password, salt, iter);
  await unlockWithBundle(key, remember, null, iter);
}
async function tryAutoUnlock(){
  let raw = null, meta = null;
  try { raw = localStorage.getItem(DK_LS); meta = JSON.parse(localStorage.getItem(META_LS)||"null"); } catch(e){}
  if (!raw) {
    try { raw = sessionStorage.getItem(DK_LS); meta = JSON.parse(sessionStorage.getItem(META_LS)||"null"); } catch(e){}
  }
  if (!raw || !meta || !meta.salt) return false;
  try {
    if (!bundlePromise) bundlePromise = fetchVaultEnvelopes();
    const key = await importRawKey(raw);
    await unlockWithBundle(key, null, meta.salt, meta.iter);
    return true;
  } catch(e) {
    try { localStorage.removeItem(DK_LS); sessionStorage.removeItem(DK_LS); } catch(_){}
    // Restart preload for manual unlock
    bundlePromise = fetchVaultEnvelopes().catch(()=>{ bundlePromise = null; });
    return false;
  }
}

$("togglePass").onclick = () => {
  const i = $("vaultPass");
  const show = i.type === "password";
  i.type = show ? "text" : "password";
  $("togglePass").textContent = show ? "Hide" : "Show";
};
$("vaultForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  clearErr();
  const password = $("vaultPass").value;
  const remember = $("rememberDevice").checked;
  if (!password) { showErr("Enter your password."); return; }
  document.body.classList.add("busy");
  $("unlockBtn").innerHTML = '<span class="spinner"></span>Unlocking…';
  try {
    await unlockWithPassword(password, remember);
  } catch (e) {
    showErr(e && e.message ? e.message : "Incorrect password. Please try again.");
    document.body.classList.remove("busy");
    $("unlockBtn").textContent = "Unlock Command Desk";
    $("vaultPass").focus();
    $("vaultPass").select();
  }
});

tryAutoUnlock().then((ok) => { if (!ok) $("vaultPass").focus(); });
})();
</script>
</body></html>
